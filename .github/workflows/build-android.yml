name: Build PrimeTV Updater APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater overlay
        uses: actions/checkout@v4

      - name: Checkout Apps2Samsung engine
        uses: actions/checkout@v4
        with:
          repository: Apps2Samsung/Apps2Samsung
          ref: beta
          path: Apps2Samsung

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore updater signing key cache
        uses: actions/cache@v4
        with:
          path: .signing
          key: primetv-updater-signing-v1

      - name: Create signing key if needed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [ ! -f .signing/primetv-updater.jks ]; then
            PASS=$(openssl rand -hex 24)
            printf '%s' "$PASS" > .signing/password.txt
            keytool -genkeypair \
              -keystore .signing/primetv-updater.jks \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias primetvupdater \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=PrimeTV Updater,O=PrimeTV,C=US"
          fi
          test -s .signing/password.txt
          test -s .signing/primetv-updater.jks

      - name: Apply PrimeTV updater overlay
        run: python3 apply_overlay.py Apps2Samsung

      - name: Restore
        run: dotnet restore Apps2Samsung/Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj

      - name: Build unsigned Release APK
        run: >-
          dotnet publish Apps2Samsung/Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj
          -c Release -f net10.0-android
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED=$(find Apps2Samsung/Apps2Samsung.Mobile/bin/Release -type f -name '*.apk' | head -n 1)
          test -n "$UNSIGNED"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$ZIPALIGN"
          test -n "$APKSIGNER"
          PASS=$(cat .signing/password.txt)
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" out/PrimeTV-Updater-aligned.apk
          "$APKSIGNER" sign \
            --ks .signing/primetv-updater.jks \
            --ks-key-alias primetvupdater \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out out/PrimeTV-Updater-v0.1.2-SIGNED.apk \
            out/PrimeTV-Updater-aligned.apk
          rm out/PrimeTV-Updater-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs out/PrimeTV-Updater-v0.1.2-SIGNED.apk | tee out/signature-verification.txt
          sha256sum out/PrimeTV-Updater-v0.1.2-SIGNED.apk | tee out/PrimeTV-Updater-v0.1.2-SIGNED.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeTV-Updater-v0.1.2-SIGNED
          path: out/*
