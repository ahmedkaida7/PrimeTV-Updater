name: Build PrimeTV Updater APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater overlay
        uses: actions/checkout@v4

      - name: Checkout Apps2Samsung engine
        uses: actions/checkout@v4
        with:
          repository: Apps2Samsung/Apps2Samsung
          ref: beta
          path: Apps2Samsung

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Apply PrimeTV updater overlay
        run: python3 apply_overlay.py Apps2Samsung

      - name: Restore
        run: dotnet restore Apps2Samsung/Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj

      # Debug configuration intentionally uses Android's standard debug signing key.
      # The previous Release artifact was unsigned and Android rejected it as "App not installed".
      - name: Build signed APK
        run: >-
          dotnet publish Apps2Samsung/Apps2Samsung.Mobile/Apps2Samsung.Mobile.csproj
          -c Debug -f net10.0-android
          -p:AndroidPackageFormats=apk

      - name: Collect and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find Apps2Samsung/Apps2Samsung.Mobile/bin/Debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" out/PrimeTV-Updater-v0.1.1-SIGNED.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs out/PrimeTV-Updater-v0.1.1-SIGNED.apk | tee out/signature-verification.txt
          sha256sum out/PrimeTV-Updater-v0.1.1-SIGNED.apk | tee out/PrimeTV-Updater-v0.1.1-SIGNED.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeTV-Updater-v0.1.1-SIGNED
          path: out/*
